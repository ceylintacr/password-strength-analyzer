<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Gücü Analizcisi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Şifre Gücü Analizcisi</h1>
      <p class="subtitle">Şifren hiçbir yere gönderilmez, tüm analiz tarayıcının içinde yapılır.</p>
    </header>

    <div class="input-wrap">
      <input id="password" type="password" placeholder="Bir şifre yaz..."
             autocomplete="off" spellcheck="false" autocapitalize="off">
      <button id="toggle" type="button">Göster</button>
    </div>

    <div class="generator">
      <label class="gen-length">
        Uzunluk <strong id="gen-length-value">16</strong>
        <input id="gen-length" type="range" min="8" max="32" value="16">
      </label>
      <div class="gen-buttons">
        <button id="generate" type="button" class="btn btn-primary">Güçlü şifre üret</button>
        <button id="copy" type="button" class="btn">Kopyala</button>
      </div>
    </div>

    <section class="meter">
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="meter-row">
        <span id="label">Analiz için bir şifre yaz</span>
        <span id="bits"></span>
      </div>
    </section>

    <div id="results" hidden>
      <section class="card">
        <h2>Entropi</h2>
        <div class="stats">
          <div><span class="k">Karakter havuzu</span><span id="pool" class="v"></span></div>
          <div><span class="k">Formül entropisi</span><span id="naive" class="v"></span></div>
          <div><span class="k">Desenler sonrası</span><span id="real" class="v"></span></div>
        </div>
        <p id="entropy-note" class="note"></p>
      </section>

      <section class="card">
        <h2>Tahmini kırılma süresi</h2>
        <ul id="crack" class="crack-list"></ul>
      </section>

      <section class="card">
        <h2>Bulunan zayıf desenler</h2>
        <div id="segments" class="segments"></div>
        <ul id="patterns" class="pattern-list"></ul>
      </section>

      <div class="two-col">
        <section class="card">
          <h2>Kontrol listesi</h2>
          <ul id="checks" class="checks"></ul>
        </section>
        <section class="card">
          <h2>Öneriler</h2>
          <ul id="tips" class="tips"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="analyzer.js"></script>
  <script src="generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
